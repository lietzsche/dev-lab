[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-lab"
version = "0.1.0"
description = "A progressive Python backend, MCP, and LLM learning project"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Python Knowledge Lab learner" }]
dependencies = []

[project.optional-dependencies]
quality = [
    "mypy>=1.13",
    "ruff>=0.8",
]
test = [
    "packaging>=24",
    "pytest>=8",
]

[project.scripts]
knowledge-lab = "knowledge_lab.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/knowledge_lab/__main__.py" = ["F401"]
"src/knowledge_lab/lessons/p4_3_note_defaults.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = [
    "src/knowledge_lab/lessons/p6_4_quality_tools.py",
    "src/knowledge_lab/lessons/p7_1_paths_and_file_io.py",
    "src/knowledge_lab/lessons/p7_2_json_persistence.py",
    "src/knowledge_lab/lessons/p7_3_sqlite_and_transactions.py",
]
strict = true
