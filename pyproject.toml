[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-lab"
version = "0.1.0"
description = "A progressive Python backend, MCP, and LLM learning project"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Python Knowledge Lab learner" }]
dependencies = []

[project.scripts]
knowledge-lab = "knowledge_lab.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
