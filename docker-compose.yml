services:
  build-jdk8:
    image: maven:3.6.3-jdk-8
    working_dir: /workspace
    volumes:
      - .:/workspace
      - maven-repository:/root/.m2
    command: mvn -B verify

  customer-api-jdk8:
    image: maven:3.6.3-jdk-8
    working_dir: /workspace
    volumes:
      - .:/workspace
      - maven-repository:/root/.m2
    ports:
      - "8080:8080"
    command:
      - /bin/sh
      - -c
      - mvn -B -pl customer-api -am package -DskipTests && java -jar customer-api/target/customer-api.war

volumes:
  maven-repository:
